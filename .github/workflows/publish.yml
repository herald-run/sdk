name: publish
# Publishes @herald-run/sdk, @herald-run/cli and @herald-run/mcp to npm and herald-run to PyPI.
# Dry runs (the default) build, test and pack everything but upload nothing; real publishes run
# from main only. Only the upload jobs get the environment, OIDC and the npm token; they run no
# installs or builds, just the artifacts the build job made.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Packages to publish
        type: choice
        options: [all, npm, sdk, cli, mcp, python]
        default: all
      dry_run:
        description: Build and verify only
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Refuse real publishes from other refs
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Pack and install the tarballs outside the workspace
        run: |
          mkdir -p dist-npm "$RUNNER_TEMP/smoke"
          npm pack ./packages/sdk/dist/npm ./packages/cli/dist/npm ./packages/mcp/dist/npm --pack-destination dist-npm
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/dist-npm/*.tgz
          node --input-type=module -e "import { Herald, version } from '@herald-run/sdk'; import { messageInputSchema } from '@herald-run/sdk/schema'; import { seal } from '@herald-run/sdk/crypto'; new Herald({ apiKey: 'x' }); console.log(version, typeof messageInputSchema.parse, typeof seal)"
          npx herald --version
          npx herald help send > /dev/null
          npx herald integrate claude-code --scope project --dry-run > integrate.txt && grep -q herald-ask integrate.txt
          npx herald-mcp --version
      - name: Build and test the wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q build
          "$RUNNER_TEMP/py/bin/python" -m build packages/python --outdir dist-python
          "$RUNNER_TEMP/py/bin/pip" install -q dist-python/*.whl
          "$RUNNER_TEMP/py/bin/python" -m unittest discover -s packages/python/tests
          ls -l dist-npm dist-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm
          path: dist-npm/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python
          path: dist-python/
          if-no-files-found: error
  npm:
    if: inputs.package != 'python'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse real publishes from other refs
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish from main, not $GITHUB_REF"
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm
          path: dist-npm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1))))throw new Error('npm '+process.argv[1]+' lacks trusted publishing')" "$(npm --version)"
      - name: Publish to npm
        env:
          PACKAGE: ${{ inputs.package }}
          DRY_RUN: ${{ inputs.dry_run }}
          # npm provenance requires a public source repository.
          PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          for name in sdk cli mcp; do
            if [ "$PACKAGE" != all ] && [ "$PACKAGE" != npm ] && [ "$PACKAGE" != "$name" ]; then continue; fi
            tarball=./$(ls dist-npm/herald-run-"$name"-*.tgz)
            version=$(tar -xOzf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            tag=latest
            case "$version" in *-*) tag=beta ;; esac
            flags=(--access public --tag "$tag")
            [ "$PROVENANCE" = true ] && flags+=(--provenance)
            [ "$DRY_RUN" = true ] && flags+=(--dry-run)
            npm publish "$tarball" "${flags[@]}"
          done
  pypi:
    if: inputs.package == 'all' || inputs.package == 'python'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # PyPI trusted publisher: herald-run/sdk, workflow publish.yml, environment packages.
    environment: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse real publishes from other refs
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish from main, not $GITHUB_REF"
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python
          path: dist-python
      - run: ls -l dist-python
      - if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-python/
