name: publish
# Publishes @herald-run/sdk, @herald-run/cli and @herald-run/mcp to npm and herald-run to PyPI.
# Dry runs (the default) build, test and pack everything but upload nothing; real publishes run
# from main only.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Packages to publish
        type: choice
        options: [all, npm, sdk, cli, mcp, python]
        default: all
      dry_run:
        description: Build and verify only
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  npm:
    if: inputs.package != 'python'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse real publishes from other refs
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Install the packed tarballs outside the workspace
        run: |
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          npm pack ./packages/sdk/dist/npm ./packages/cli/dist/npm ./packages/mcp/dist/npm --pack-destination "$dir"
          cd "$dir"
          npm init -y > /dev/null
          npm install ./herald-run-sdk-*.tgz ./herald-run-cli-*.tgz ./herald-run-mcp-*.tgz
          node --input-type=module -e "import { Herald, version } from '@herald-run/sdk'; import { messageInputSchema } from '@herald-run/sdk/schema'; import { seal } from '@herald-run/sdk/crypto'; new Herald({ apiKey: 'x' }); console.log(version, typeof messageInputSchema.parse, typeof seal)"
          npx herald --version
          npx herald help send > /dev/null
          npx herald integrate claude-code --scope project --dry-run > integrate.txt && grep -q herald-ask integrate.txt
          npx herald-mcp --version
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          DRY_RUN: ${{ inputs.dry_run }}
          # npm provenance requires a public source repository.
          PROVENANCE: ${{ !github.event.repository.private }}
        run: |
          for name in sdk cli mcp; do
            if [ "$PACKAGE" != all ] && [ "$PACKAGE" != npm ] && [ "$PACKAGE" != "$name" ]; then continue; fi
            dir="./packages/$name/dist/npm"
            version=$(node -p "require('$dir/package.json').version")
            tag=latest
            case "$version" in *-*) tag=beta ;; esac
            flags=(--access public --tag "$tag")
            [ "$PROVENANCE" = true ] && flags+=(--provenance)
            [ "$DRY_RUN" = true ] && flags+=(--dry-run)
            npm publish "$dir" "${flags[@]}"
          done
  pypi:
    if: inputs.package == 'all' || inputs.package == 'python'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # PyPI trusted publisher: this repository, workflow publish.yml, environment packages.
    environment: packages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse real publishes from other refs
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and test the wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q build
          "$RUNNER_TEMP/py/bin/python" -m build packages/python --outdir dist-python
          "$RUNNER_TEMP/py/bin/pip" install -q dist-python/*.whl
          "$RUNNER_TEMP/py/bin/python" -m unittest discover -s packages/python/tests
          ls -l dist-python
      - if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-python/
